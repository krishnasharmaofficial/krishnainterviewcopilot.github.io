<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYS_LOG_VIEWER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .skin-stealth { background-color: #fcfcfc; color: #444; }
        .skin-stealth .header { background-color: #f0f0f0; border-color: #e2e8f0; }
        .skin-stealth .card { background-color: #fff; border-bottom: 1px solid #f1f5f9; }
        
        .skin-pro { background-color: #080808; color: #eee; }
        .skin-pro .header { background-color: #111; border-color: #222; }
        .skin-pro .card { background-color: transparent; border-bottom: 1px solid #1a1a1a; }
    </style>
</head>
<body class="skin-stealth transition-colors duration-300 overflow-hidden flex flex-col fixed inset-0">

    <header class="header h-10 flex items-center justify-between px-3 border-b sticky top-0 z-50 transition-colors shrink-0">
        <div class="flex items-center gap-2">
            <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-gray-300"></div>
            <span class="text-[9px] font-bold uppercase tracking-tight opacity-40 font-mono">SYS_STABLE_V12</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleSkin()" class="p-2 opacity-30" title="Toggle Skin">
                <svg id="skin-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10h10V2z"/><path d="m17 15 5 5"/><path d="m22 15-5 5"/><circle cx="18" cy="7" r="3"/><path d="M2 22v-5c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v5"/></svg>
            </button>
            <button onclick="toggleSettings(true)" class="p-2 opacity-30" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </header>

    <div class="transcript-box h-10 shrink-0 p-2 flex items-start gap-2 overflow-y-auto no-scrollbar border-b bg-black/5">
        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-1 opacity-20"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <p id="transcript-text" class="text-[9px] italic leading-tight opacity-40">Tap 'Start' to capture audio...</p>
    </div>

    <div id="content-area" class="flex-1 overflow-y-auto p-3 no-scrollbar pb-32">
        <div id="empty-state" class="py-20 text-center opacity-5">
            <svg class="mx-auto" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 3"/></svg>
            <p class="mt-2 text-[10px] font-bold uppercase tracking-widest font-mono">Awaiting Input</p>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-3 pb-6 border-t bg-inherit flex items-center justify-between max-w-lg mx-auto z-40">
        <div class="flex gap-1">
            <button onclick="clearAll()" class="p-3 opacity-20" title="Clear All">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
            <button onclick="exportToWord()" class="p-3 opacity-20" title="Export to Word">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
        </div>
        
        <button id="action-btn" onclick="toggleListening()" class="px-8 py-3 rounded-lg font-bold uppercase tracking-widest text-[9px] shadow-lg transition-all active:scale-95 bg-[#333] text-white">
            Start Question
        </button>

        <button onclick="copyLastAnswer()" class="p-3 opacity-20" title="Copy Last">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="w-full max-w-sm bg-[#111] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-5">
                <h2 class="text-xs font-bold mb-4 text-white uppercase tracking-tighter">System Configuration</h2>
                
                <label class="block text-[8px] font-bold uppercase opacity-40 mb-1 text-white">Groq API Key</label>
                <input id="api-key-input" type="password" class="w-full bg-white/5 border border-white/10 p-2.5 rounded-lg text-white mb-4 font-mono text-[10px] outline-none" placeholder="gsk_...">

                <label class="block text-[8px] font-bold uppercase opacity-40 mb-1 text-white">Your Resume (Context)</label>
                <textarea id="resume-input" class="w-full bg-white/5 border border-white/10 p-2.5 rounded-lg text-white h-32 text-[9px] mb-4 outline-none resize-none" placeholder="Paste resume..."></textarea>

                <button onclick="saveSettings()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold uppercase text-[9px] hover:bg-blue-500 transition-colors">Save & Initialize</button>
                <button onclick="toggleSettings(false)" class="w-full mt-2 py-2 text-[8px] text-white/30 uppercase tracking-widest">Close</button>
            </div>
        </div>
    </div>

    <script>
        let isListening = false;
        let recognition = null;
        let currentTranscript = "";
        let conversationHistory = []; 
        let skin = localStorage.getItem('app_skin') || 'stealth';
        
        const BASE_SYSTEM_PROMPT = `Act as a Senior Architect.
- Use LIGHT TECHNICAL language. Focus on memory, performance, and best practices.
- NO simple analogies (No cars, clubs, blueprints, or shopping carts). 
- Use FIRST PERSON ("I typically...", "In my experience...").
- Explain the "WHY" (trade-offs, why this matters in production).
- Use SHORT BULLET POINTS for readability.
- NO INTROS. Do not say "Sure" or "I can explain that". 
- Context is key: Use previous history to answer follow-up questions precisely.`;

        document.getElementById('api-key-input').value = localStorage.getItem('groq_key') || '';
        document.getElementById('resume-input').value = localStorage.getItem('resume_text') || '';
        if (!localStorage.getItem('groq_key')) toggleSettings(true);
        applySkin();

        function toggleSkin() {
            skin = skin === 'stealth' ? 'pro' : 'stealth';
            localStorage.setItem('app_skin', skin);
            applySkin();
        }

        function applySkin() {
            document.body.className = `skin-${skin} transition-colors duration-300 overflow-hidden flex flex-col fixed inset-0`;
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').classList.toggle('hidden', !show);
        }

        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            const res = document.getElementById('resume-input').value.trim();
            localStorage.setItem('groq_key', key);
            localStorage.setItem('resume_text', res);
            toggleSettings(false);
        }

        function toggleListening() {
            if (isListening) stopAndProcess();
            else startSpeech();
        }

        function startSpeech() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Speech recognition not supported.");
                return;
            }
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                updateMicUI(true);
                currentTranscript = "";
            };

            recognition.onresult = (event) => {
                let interim = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    interim += event.results[i][0].transcript;
                }
                currentTranscript = interim;
                document.getElementById('transcript-text').innerText = currentTranscript || "Listening...";
            };

            recognition.onend = () => { if(isListening) recognition.start(); };
            recognition.start();
        }

        function stopAndProcess() {
            if (recognition) {
                recognition.onend = null;
                recognition.stop();
            }
            isListening = false;
            updateMicUI(false);
            if (currentTranscript.trim()) handleQuestion(currentTranscript);
        }

        function updateMicUI(listening) {
            const btn = document.getElementById('action-btn');
            const dot = document.getElementById('status-dot');
            if (listening) {
                btn.innerText = "Stop & Get Answer";
                btn.classList.add('bg-red-600');
                dot.classList.add('bg-red-500', 'animate-pulse');
            } else {
                btn.innerText = "Start Question";
                btn.classList.remove('bg-red-600');
                dot.classList.remove('bg-red-500', 'animate-pulse');
            }
        }

        async function handleQuestion(text) {
            document.getElementById('empty-state').classList.add('hidden');
            const contentArea = document.getElementById('content-area');
            
            contentArea.scrollTo({ top: 0, behavior: 'smooth' });

            const entryId = 'entry-' + Date.now();
            const html = `
                <div id="${entryId}" class="card py-4 animate-in fade-in slide-in-from-top-2 duration-300">
                    <div class="flex items-center gap-1 mb-2 opacity-20 border-b border-current pb-1">
                        <span class="text-[8px] font-bold uppercase truncate max-w-[80%]">${text}</span>
                    </div>
                    <div class="answer-box whitespace-pre-wrap leading-relaxed text-sm sm:text-base">
                        <span class="opacity-20 text-[8px] font-bold uppercase animate-pulse">Processing...</span>
                    </div>
                </div>
            `;
            contentArea.insertAdjacentHTML('afterbegin', html);

            await getResponse(text, entryId);
        }

        async function getResponse(question, entryId) {
            const apiKey = localStorage.getItem('groq_key');
            if (!apiKey) return toggleSettings(true);

            const resume = localStorage.getItem('resume_text') || "";
            const history = conversationHistory.slice(-4).map(m => `${m.role === 'user' ? 'Question' : 'Answer'}: ${m.content}`).join("\n");

            const prompt = `${BASE_SYSTEM_PROMPT}\n\nUSER BACKGROUND:\n${resume}\n\nHISTORY:\n${history}\n\nNEW QUESTION: ${question}`;

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.5,
                        max_tokens: 1200
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                const answer = data.choices[0].message.content;

                document.getElementById(entryId).querySelector('.answer-box').innerText = answer;

                conversationHistory.push({ role: "user", content: question });
                conversationHistory.push({ role: "assistant", content: answer });

            } catch (err) {
                document.getElementById(entryId).querySelector('.answer-box').innerText = "ERROR: Check API Key or Connection.";
            }
        }

        function clearAll() {
            if(!confirm("Wipe all data?")) return;
            document.getElementById('content-area').innerHTML = '<div id="empty-state" class="py-20 text-center opacity-5"><svg class="mx-auto" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 3"/></svg><p class="mt-2 text-[10px] font-bold uppercase tracking-widest font-mono">Awaiting Input</p></div>';
            conversationHistory = [];
        }

        function copyLastAnswer() {
            const firstAnswer = document.querySelector('.answer-box');
            if (firstAnswer) {
                const el = document.createElement('textarea');
                el.value = firstAnswer.innerText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            }
        }

        function exportToWord() {
            if (conversationHistory.length === 0) return alert("Nothing to export.");

            let docContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Interview Transcript</title>
                <style>
                    body { font-family: 'Arial', sans-serif; line-height: 1.5; padding: 20px; }
                    .question { font-weight: bold; color: #1a56db; font-size: 14pt; border-bottom: 1px solid #eee; margin-top: 20px; }
                    .answer { font-size: 11pt; color: #333; margin-bottom: 10px; white-space: pre-wrap; }
                    .timestamp { font-size: 8pt; color: #999; }
                </style>
                </head>
                <body>
                <h1 style='text-align:center;'>Interview Transcript - SYS_LOG</h1>
            `;

            // Export in chronological order (User Question then AI Answer)
            for (let i = 0; i < conversationHistory.length; i += 2) {
                const q = conversationHistory[i]?.content || "";
                const a = conversationHistory[i + 1]?.content || "";
                docContent += `
                    <div class="question">QUESTION: ${q}</div>
                    <div class="answer">${a.replace(/\n/g, '<br/>')}</div>
                `;
            }

            docContent += "</body></html>";

            const blob = new Blob(['\ufeff', docContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `Interview_Transcript_${new Date().toISOString().slice(0,10)}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
