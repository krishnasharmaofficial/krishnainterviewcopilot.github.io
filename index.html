<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYS_LOG_VIEWER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .skin-stealth { background-color: #fcfcfc; color: #444; }
        .skin-stealth .header { background-color: #f0f0f0; border-color: #e2e8f0; }
        .skin-stealth .card { background-color: #fff; border-bottom: 1px solid #f1f5f9; }
        
        .skin-pro { background-color: #080808; color: #eee; }
        .skin-pro .header { background-color: #111; border-color: #222; }
        .skin-pro .card { background-color: transparent; border-bottom: 1px solid #1a1a1a; }
        
        .answer-box ul { 
            list-style-type: disc; 
            padding-left: 1rem; 
            margin-top: 0.25rem;
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }
        .answer-box li { 
            display: list-item; 
            line-height: 1.35;
            margin-bottom: 2px;
        }
        
        pre {
            background: rgba(0,0,0,0.05);
            padding: 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            overflow-x: auto;
            margin: 4px 0;
            border: 1px solid rgba(0,0,0,0.1);
            line-height: 1.3;
            white-space: pre;
        }
        .skin-pro pre {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }
        code {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: #d97706;
        }
        .skin-pro code {
            color: #fbbf24;
        }
    </style>
</head>
<body class="skin-stealth transition-colors duration-300 overflow-hidden flex flex-col fixed inset-0">

    <header class="header h-10 flex items-center justify-between px-3 border-b sticky top-0 z-50 transition-colors shrink-0">
        <div class="flex items-center gap-2">
            <div id="status-dot" class="w-1.5 h-1.5 rounded-full bg-gray-300"></div>
            <span class="text-[9px] font-bold uppercase tracking-tight opacity-40 font-mono">CODE_ARCHITECT_V26</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleSkin()" class="p-2 opacity-30">
                <svg id="skin-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10h10V2z"/><path d="m17 15 5 5"/><path d="m22 15-5 5"/><circle cx="18" cy="7" r="3"/><path d="M2 22v-5c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v5"/></svg>
            </button>
            <button onclick="toggleSettings(true)" class="p-2 opacity-30">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </header>

    <div class="transcript-box h-8 shrink-0 p-2 flex items-start gap-2 overflow-y-auto no-scrollbar border-b bg-black/5">
        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 opacity-20"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <p id="transcript-text" class="text-[8px] italic leading-tight opacity-40">Listening...</p>
    </div>

    <div id="content-area" class="flex-1 overflow-y-auto p-4 no-scrollbar pb-32">
        <div id="empty-state" class="py-20 text-center opacity-5">
            <svg class="mx-auto" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 8v4l3 3"/></svg>
            <p class="mt-2 text-[10px] font-bold uppercase tracking-widest font-mono">Neural Interface Ready</p>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-3 pb-6 border-t bg-inherit flex items-center justify-between max-w-lg mx-auto z-40 shadow-inner">
        <div class="flex flex-col gap-1">
            <div class="flex gap-1">
                <button onclick="clearAll()" class="p-3 opacity-20" title="Clear All">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
                <button onclick="exportToWord()" class="p-3 opacity-20" title="Export to Word">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
            </div>
            <span class="text-[7px] font-mono opacity-20 ml-3 uppercase tracking-tighter">SYNTAX_HIGHLIGHT: ENABLED</span>
        </div>
        
        <button id="action-btn" onclick="toggleListening()" class="px-8 py-3 rounded-lg font-bold uppercase tracking-widest text-[10px] shadow-lg transition-all active:scale-95 bg-[#333] text-white">
            Start Question
        </button>

        <button onclick="copyLastAnswer()" class="p-3 opacity-20" title="Copy Last">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="w-full max-w-sm bg-[#111] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-5">
                <h2 class="text-xs font-bold mb-4 text-white uppercase tracking-tighter">System Configuration</h2>
                
                <label class="block text-[8px] font-bold uppercase opacity-40 mb-1 text-white">Groq API Key</label>
                <input id="api-key-input" type="password" class="w-full bg-white/5 border border-white/10 p-2.5 rounded-lg text-white mb-4 font-mono text-[10px] outline-none" placeholder="gsk_...">

                <label class="block text-[8px] font-bold uppercase opacity-40 mb-1 text-white">Resume (PDF/DOCX)</label>
                <div class="relative w-full mb-4">
                    <input type="file" id="resume-file" accept=".pdf,.docx" class="hidden" onchange="handleFileUpload(event)">
                    <button onclick="document.getElementById('resume-file').click()" class="w-full bg-white/5 border border-dashed border-white/20 p-4 rounded-lg text-white/50 text-[10px] hover:bg-white/10 transition-all flex flex-col items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span id="file-status">Upload Resume</span>
                    </button>
                </div>

                <label class="block text-[8px] font-bold uppercase opacity-40 mb-1 text-white">Active Context</label>
                <textarea id="resume-input" class="w-full bg-white/5 border border-white/10 p-2.5 rounded-lg text-white h-24 text-[9px] mb-4 outline-none resize-none no-scrollbar" placeholder="Context data..."></textarea>

                <button onclick="saveSettings()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold uppercase text-[9px]">Apply Changes</button>
                <button onclick="toggleSettings(false)" class="w-full mt-2 py-2 text-[8px] text-white/30 uppercase tracking-widest">Close</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '[https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js](https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js)';

        let isListening = false;
        let recognition = null;
        let currentTranscript = "";
        let finalTranscript = "";
        let conversationHistory = []; 
        let skin = localStorage.getItem('app_skin') || 'stealth';
        
        const BASE_SYSTEM_PROMPT = `You are a Master .NET/WPF Technical Architect.
- DOMAIN: C#, .NET, WPF, DBMS, DSA. Assume ALL questions fall in this domain.
- PHONETIC AUTOCORRECT (CRITICAL): Transcription is poor. Aggressively translate garbled words to domain terms. "hoops" -> "OOPs concepts" (Object Oriented), "rough" -> "ref", "bound" -> "binding", "zammel" -> "XAML", "a sink" -> "async". DO NOT mention transcription errors.
- TECHNICAL ACCURACY: Verify all C# concepts (e.g., classes don't support multiple inheritance).
- TONE: Authoritative and objective. NO first-person phrasing ("I prefer").
- CODE FORMATTING: Use markdown code blocks (\`\`\`csharp\n...\n\`\`\`). NEVER put bullet points (- or *) on backtick lines or inside code blocks. ONLY provide ONE code snippet.
- FORMAT: STRICTLY 3-4 SUBSTANTIVE BULLETS for text. No intro/outro fluff. Start immediately.`;

        document.getElementById('api-key-input').value = localStorage.getItem('groq_key') || '';
        document.getElementById('resume-input').value = localStorage.getItem('resume_text') || '';
        if (!localStorage.getItem('groq_key')) toggleSettings(true);
        applySkin();

        function toggleSkin() {
            skin = skin === 'stealth' ? 'pro' : 'stealth';
            localStorage.setItem('app_skin', skin);
            applySkin();
        }

        function applySkin() {
            document.body.className = `skin-${skin} transition-colors duration-300 overflow-hidden flex flex-col fixed inset-0`;
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').classList.toggle('hidden', !show);
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('file-status').innerText = "Reading...";
            const reader = new FileReader();

            if (file.type === "application/pdf") {
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(s => s.str).join(" ") + "\n";
                    }
                    document.getElementById('resume-input').value = fullText;
                    document.getElementById('file-status').innerText = "PDF Loaded";
                };
                reader.readAsArrayBuffer(file);
            } else if (file.name.endsWith(".docx")) {
                reader.onload = async function() {
                    const arrayBuffer = this.result;
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    document.getElementById('resume-input').value = result.value;
                    document.getElementById('file-status').innerText = "DOCX Loaded";
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function saveSettings() {
            localStorage.setItem('groq_key', document.getElementById('api-key-input').value.trim());
            localStorage.setItem('resume_text', document.getElementById('resume-input').value.trim());
            toggleSettings(false);
        }

        function toggleListening() {
            if (isListening) stopAndProcess();
            else startSpeech();
        }

        function startSpeech() {
            if (!('webkitSpeechRecognition' in window)) return alert("Voice API unavailable.");
            currentTranscript = "";
            finalTranscript = "";
            document.getElementById('transcript-text').innerText = "Listening...";
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onstart = () => { isListening = true; updateMicUI(true); };
            recognition.onresult = (event) => {
                let interimTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + " ";
                    else interimTranscript += event.results[i][0].transcript;
                }
                currentTranscript = finalTranscript + interimTranscript;
                document.getElementById('transcript-text').innerText = currentTranscript || "Listening...";
            };
            recognition.onend = () => { if(isListening) recognition.start(); };
            recognition.start();
        }

        function stopAndProcess() {
            isListening = false;
            if (recognition) { recognition.onend = null; recognition.stop(); }
            updateMicUI(false);
            const textToProcess = currentTranscript.trim();
            if (textToProcess) handleQuestion(textToProcess);
            else document.getElementById('transcript-text').innerText = "Ready to transcribe...";
        }

        function updateMicUI(listening) {
            const btn = document.getElementById('action-btn');
            const dot = document.getElementById('status-dot');
            if (listening) {
                btn.innerText = "Stop & Answer";
                btn.classList.add('bg-red-600');
                dot.classList.add('bg-red-500', 'animate-pulse');
            } else {
                btn.innerText = "Start Question";
                btn.classList.remove('bg-red-600');
                dot.classList.remove('bg-red-500', 'animate-pulse');
            }
        }

        async function handleQuestion(text) {
            document.getElementById('empty-state').classList.add('hidden');
            const contentArea = document.getElementById('content-area');
            contentArea.scrollTo({ top: 0, behavior: 'smooth' });
            const entryId = 'entry-' + Date.now();
            contentArea.insertAdjacentHTML('afterbegin', `
                <div id="${entryId}" class="card py-4 animate-in fade-in slide-in-from-top-2 duration-300">
                    <div class="flex items-center gap-1 mb-2 opacity-20 border-b border-current pb-1">
                        <span class="text-[8px] font-bold uppercase truncate max-w-[90%] font-mono">${text}</span>
                    </div>
                    <div class="answer-box text-[11px] sm:text-xs leading-snug">
                        <span class="opacity-20 text-[8px] font-bold uppercase animate-pulse">Processing...</span>
                    </div>
                </div>
            `);
            await getResponse(text, entryId);
        }

        function formatMarkdown(text) {
            let html = text;
            
            // Forcefully strip bullets from markdown code fences to fix syntax highlighting
            html = html.replace(/^[\s\-*+]*```/gm, '```');
            
            const tick = '\`';
            const tripleTick = tick + tick + tick;
            const codeRegex = new RegExp(tripleTick + '(?:[a-z]+)?\\s*\\n([\\s\\S]*?)\\n\\s*' + tripleTick, 'g');
            
            html = html.replace(codeRegex, function(match, codeBlock) {
                // Strip bullets if AI forced them onto every line of code inside the block
                const cleanedCode = codeBlock.replace(/^[\s\-*+]*\s?/gm, '');
                return '<pre><code>' + cleanedCode + '</code></pre>';
            });
            
            const parts = html.split(/(<pre>[\s\S]*?<\/pre>)/);
            let finalHtml = '';
            
            parts.forEach(part => {
                if (part.startsWith('<pre>')) {
                    finalHtml += part;
                } else {
                    const lines = part.split('\n').filter(l => l.trim().length > 0);
                    if (lines.length > 0) {
                        finalHtml += '<ul>';
                        lines.forEach(line => {
                            const cleanLine = line.replace(/^[\s\-\*\+]+/, '').trim();
                            if (cleanLine) finalHtml += '<li>' + cleanLine + '</li>';
                        });
                        finalHtml += '</ul>';
                    }
                }
            });
            return finalHtml;
        }

        async function getResponse(question, entryId) {
            const apiKey = localStorage.getItem('groq_key');
            if (!apiKey) return toggleSettings(true);
            const resume = localStorage.getItem('resume_text') || "";
            const history = conversationHistory.slice(-4).map(m => `${m.role === 'user' ? 'Q' : 'A'}: ${m.content}`).join("\n");
            const prompt = `${BASE_SYSTEM_PROMPT}\n\nUSER CONTEXT:\n${resume}\n\nHISTORY:\n${history}\n\nINPUT: ${question}`;
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.1
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Check API Key");
                const answer = data.choices[0].message.content;
                
                const box = document.getElementById(entryId).querySelector('.answer-box');
                if (box) box.innerHTML = formatMarkdown(answer);
                conversationHistory.push({ role: "user", content: question }, { role: "assistant", content: answer });
            } catch (err) {
                const box = document.getElementById(entryId).querySelector('.answer-box');
                if (box) box.innerHTML = `<span class="text-red-500 font-bold uppercase text-[10px]">Error: ${err.message}</span>`;
            }
        }

        function clearAll() {
            if(!confirm("Wipe logs?")) return;
            document.getElementById('content-area').innerHTML = '<div id="empty-state" class="py-20 text-center opacity-5"><p class="text-[10px] font-bold uppercase font-mono">System Standby</p></div>';
            conversationHistory = [];
        }

        function copyLastAnswer() {
            const boxes = document.querySelectorAll('.answer-box');
            if (boxes.length > 0) {
                const box = boxes[0];
                const el = document.createElement('textarea');
                el.value = box.innerText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
            }
        }

        function exportToWord() {
            if (conversationHistory.length === 0) return;
            let docContent = "<html><body><h1>Transcript</h1>";
            for (let i = 0; i < conversationHistory.length; i += 2) {
                docContent += `<p><b>Q:</b> ${conversationHistory[i].content}</p><p><b>A:</b> ${conversationHistory[i+1].content.replace(/\n/g, '<br/>')}</p><hr/>`;
            }
            docContent += "</body></html>";
            const blob = new Blob(['\ufeff', docContent], { type: 'application/msword' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Log.doc";
            link.click();
        }
    </script>
</body>
</html>
